# Donne une histoire aux workflows n8n.
#
# n8n versionne deja en interne : le retour arriere existe sans nous. Ce que
# n8n ne fait pas, c'est survivre a la perte du VPS et rendre un changement
# d'automatisation RELISIBLE a cote du code applicatif dont il depend.
#
# ELLE TOURNE PARCE QU'UN EXPORT MANUEL POURRIT. Le depot mentirait des la
# premiere modification faite dans l'interface, et un depot qui ment sur la
# production est pire que pas de depot. Voir l'en-tete de
# scripts/exporter-workflows-n8n.mjs.
name: Exporter les workflows n8n

on:
  schedule:
    # Abidjan ne change jamais d'heure : UTC = heure locale. 5 h du matin, quand
    # personne ne modifie un workflow — la PR attend le reveil, elle ne coupe
    # pas une session de travail en cours.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Deux exports en parallele se disputeraient la meme branche.
concurrency:
  group: exporter-n8n
  cancel-in-progress: false

jobs:
  exporter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lire n8n et ecrire n8n/
        run: node scripts/exporter-workflows-n8n.mjs
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          # Facultatif : le script porte sa valeur par defaut.
          N8N_API_URL: ${{ vars.N8N_API_URL }}

      # L'export est deterministe — deux passages rendent des octets
      # identiques. Un diff non vide signifie donc qu'un humain a change
      # quelque chose dans n8n, jamais qu'un horodatage a bouge.
      - name: Y a-t-il un vrai changement ?
        id: diff
        run: |
          if [ -z "$(git status --porcelain n8n/)" ]; then
            echo "change=non" >> "$GITHUB_OUTPUT"
            echo "Aucun changement dans n8n depuis le dernier export."
          else
            echo "change=oui" >> "$GITHUB_OUTPUT"
            git status --short n8n/
          fi

      # UNE PR, PAS UNE POUSSEE DIRECTE. `main` est protegee, et surtout : le
      # diff EST la revue. Un changement d'automatisation qui atterrit sans que
      # personne ne le regarde ne vaut pas mieux que pas de trace du tout.
      # ── UNE PR QUI N'A PLUS RIEN A PROPOSER DOIT SE FERMER ─────────────────
      #
      # Ces deux sauvegardes savaient ouvrir une PR et la mettre a jour. Aucune
      # ne savait la SOLDER : quand le depot rattrapait la production — parce
      # que la PR avait ete fusionnee autrement, ou parce que le changement
      # avait ete defait dans l'interface — l'etape « ouvrir ou mettre a jour »
      # etait simplement sautee, et la PR restait ouverte avec un diff devenu
      # faux. C'est ce qui s'est passe le 2 septembre 2026 : deux PR fermees a
      # la main, et une main est exactement ce qui manquera la prochaine fois.
      #
      # ELLE NE FERME QUE CE QUE PLUS RIEN NE PROPOSE. `change=non` veut dire
      # que le depot et la production coincident : il n'y a donc, par
      # construction, plus rien a relire dans cette PR.
      #
      # Elle ne peut pas faire echouer la sauvegarde — ce serait echanger une
      # PR en trop contre une reference manquante — mais elle ne se tait pas
      # non plus : un refus laisse un avertissement dans le journal.
      - name: Solder la PR devenue sans objet
        if: steps.diff.outputs.change == 'non'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHE: export-n8n
        run: |
          if ! gh pr view "$BRANCHE" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "Aucune PR ouverte a solder."
            exit 0
          fi
          gh pr comment "$BRANCHE" --body "Le depot et la production coincident de nouveau : cette PR n'a plus rien a proposer. Fermee automatiquement par la sauvegarde."             || echo "::warning::Commentaire refuse."
          if gh pr close "$BRANCHE" --delete-branch; then
            echo "PR sans objet fermee."
          else
            echo "::warning::Fermeture refusee — la PR reste ouverte avec un diff perime."
          fi

      - name: Ouvrir ou mettre a jour la PR
        if: steps.diff.outputs.change == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCHE="export-n8n"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Toujours la meme branche : deux jours de suite sans relecture
          # donnent une PR mise a jour, pas deux PR concurrentes.
          git checkout -B "$BRANCHE"
          git add n8n/
          git commit -m "n8n : etat des workflows au $(date -u '+%Y-%m-%d')" \
                     -m "Export automatique. Le diff est la revue : il ne contient que ce qu'un humain a change dans l'interface n8n."
          # `--force-with-lease` SANS REFERENCE DISTANTE REFUSE DE POUSSER.
          #
          # Il compare a la ref de suivi `origin/$BRANCHE` — que ce clone n'a
          # pas, puisqu'il ne connait que `main`. Git repond alors « stale
          # info » et abandonne, sans jamais toucher au distant.
          #
          # CE QUE CA PRODUISAIT, LU DANS L'HISTORIQUE LE 22 AOUT 2026 : cet
          # export n'a REUSSI que les fois ou il n'avait RIEN a pousser. Les
          # quatre executions porteuses d'un changement ont echoue, et un run
          # « rien n'a bouge » se rapporte en succes — donc personne ne l'a vu.
          # Le depot portait une copie perimee, et le garde qui devait
          # l'empecher etait justement celui qui ne tournait pas.
          #
          # On rapatrie donc la branche AVANT de pousser, avec un refspec
          # EXPLICITE. `actions/checkout` configure un refspec limite a la
          # branche extraite : un simple `git fetch origin "$BRANCHE"` remplit
          # FETCH_HEAD sans creer `refs/remotes/origin/$BRANCHE`, et le bail
          # n'aurait toujours rien a quoi se comparer. Corriger a moitie aurait
          # laisse croire que c'etait repare.
          #
          # `|| true` : la premiere fois la branche n'existe pas, et c'est
          # normal — le bail accepte alors une creation.
          git fetch origin "+refs/heads/$BRANCHE:refs/remotes/origin/$BRANCHE" || true
          git push --force-with-lease origin "$BRANCHE"

          if gh pr view "$BRANCHE" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR deja ouverte, mise a jour."
          else
            # Le corps passe par un fichier : ecrit en ligne, ses retours a la
            # ligne cassaient le bloc YAML de cette etape.
            cat > /tmp/corps-pr.md <<'CORPS'
          L'export quotidien a trouve une difference entre le depot et l'instance n8n.

          Le diff ci-dessous est **la revue** : l'export est deterministe, donc tout
          ce qui apparait a ete change par un humain dans l'interface.

          Fusionner vaut dire : oui, ce changement est voulu et je veux qu'il soit
          trace. Fermer sans fusionner vaut dire : ce changement ne devrait pas etre
          la — auquel cas c'est n8n qu'il faut corriger, pas cette PR.
          CORPS
            sed -i 's/^          //' /tmp/corps-pr.md
            gh pr create --base main --head "$BRANCHE" \
              --title "n8n : des workflows ont change" \
              --body-file /tmp/corps-pr.md
          fi
