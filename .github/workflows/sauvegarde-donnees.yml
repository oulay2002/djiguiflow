# La sauvegarde des DONNEES. Celle qui n'existait pas.
#
# CE QU'ON A DECOUVERT LE 22 AOUT 2026. Le tableau de bord Supabase, onglet
# « Scheduled backups » : AUCUNE sauvegarde. Le projet est sur l'offre gratuite,
# qui n'en fait pas. `docs/REPRISE.md` affirmait pourtant que les donnees se
# restauraient « depuis les sauvegardes Supabase ». Un document de reprise qui
# designe un secours inexistant est pire que pas de document : on ne cherche pas
# d'alternative tant qu'on croit en avoir une.
#
# Consequence, avant ce fichier : une migration qui efface une colonne, un
# `delete` sans `where`, une suppression de projet — tous DEFINITIFS. Le depot
# ne rattrapait rien : `supabase/reference/schema.sql` reconstruit les tables
# VIDES. Le code se reecrit, une commande perdue est perdue.
#
# POURQUOI CA NE PEUT PAS ATTERRIR ICI. Le depot djiguiflow est PUBLIC, et un
# export de donnees contient les noms, telephones et adresses de vrais clients.
# Les artefacts d'un depot public sont telechargeables par n'importe qui : il
# n'y a pas de version « discrete » de cette erreur. Le dump est donc ecrit dans
# $RUNNER_TEMP, hors de l'arbre de travail, et pousse vers un depot PRIVE.
#
# LA CLE EST UNE CLE DE DEPLOIEMENT, PAS UN JETON DE COMPTE. Elle n'ouvre qu'un
# seul depot, en ecriture, et rien d'autre. Un jeton personnel aurait donne
# acces a tout le compte depuis un secret pose dans un depot public.
#
# ON PASSE PAR LA CLI SUPABASE, jamais par une connexion Postgres directe :
# l'hote direct de Supabase est joignable en IPv6 seulement, et les executeurs
# GitHub n'ont que de l'IPv4. C'est la panne deja rencontree cote n8n. La CLI
# passe par le pooler et fonctionne — `sauvegarde-schema.yml` le prouve.
name: Sauvegarde des donnees

on:
  schedule:
    # Abidjan ne change jamais d'heure : UTC = heure locale. 4 h 30, AVANT
    # l'export n8n et la reference de schema, pour que la sauvegarde la plus
    # irremplacable passe en premier si le quota d'executions se resserre.
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sauvegarde-donnees
  cancel-in-progress: false

env:
  PROJET: xshksvlnrgxijsznmkkj
  # Le canal technique de la plateforme, le meme repli que `veille-n8n.mjs`.
  # Une alerte qui ne part pas faute de variable est pire qu'une alerte absente :
  # le premier brouillon de ce fichier lisait `vars.TELEGRAM_ALERTE_CHAT_ID`,
  # qui n'existe pas — l'alerte d'echec ne serait JAMAIS partie.
  CHAT_DEFAUT: '-1003994906478'

jobs:
  sauvegarder:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: supabase/setup-cli@v1
        with:
          # UNE VERSION FIXE, PAS « latest ».
          #
          # `latest` fait resoudre la derniere release par l'API GitHub, sans
          # jeton. Le 24 aout 2026, cet appel a ete refuse — « rate limit
          # exceeded » — et le garde de schema a echoue sur une PR dont le code
          # etait parfaitement sain.
          #
          # C'EST LE PIRE DEFAUT POSSIBLE POUR UN GARDE. Un controle qui tombe
          # au hasard, pour une raison etrangere a ce qu'il verifie, apprend a
          # relancer sans lire. Le jour ou il tombe pour une VRAIE raison, on
          # relance aussi. Un garde qu'on ignore ne garde rien, et il coute la
          # confiance qu'on avait dans les autres.
          #
          # Une version epinglee supprime l'appel de resolution. Elle se monte
          # a la main, ce qui est le but : la CLI qui compare le depot a la
          # base ne doit pas changer sous nos pieds un matin.
          version: 2.115.0

      # Un secret absent doit se dire en clair. Sans ce garde, le job echouerait
      # plus loin sur un message d'authentification illisible.
      - name: Verifier que les secrets sont poses
        env:
          JETON: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLE: ${{ secrets.SAUVEGARDE_DEPLOY_KEY }}
          ANON: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          manque=0
          [ -z "$JETON" ] && { echo "::error::SUPABASE_ACCESS_TOKEN est absent."; manque=1; }
          [ -z "$CLE" ]   && { echo "::error::SAUVEGARDE_DEPLOY_KEY est absent."; manque=1; }
          [ -z "$ANON" ]  && { echo "::error::La variable SUPABASE_ANON_KEY est absente."; manque=1; }
          exit $manque

      - name: Ecrire les donnees
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/donnees"

          # UN SEUL DUMP SUFFIT. La premiere execution, le 22 aout 2026, a montre
          # que `--data-only` couvre deja `public`, `auth` ET `storage` : un
          # second export du seul schema `auth` dupliquait 58 Ko chaque nuit
          # pour rien.
          supabase db dump --linked --project-ref "$PROJET" \
            --data-only -f "$RUNNER_TEMP/donnees/donnees.sql"

          F="$RUNNER_TEMP/donnees/donnees.sql"

          # UN DUMP VIDE SERAIT PIRE QU'UNE ABSENCE DE DUMP : on croirait avoir
          # une sauvegarde. On refuse plutot que d'ecrire un fichier creux.
          [ -s "$F" ] || { echo "::error::Le dump est vide. Rien n'est pousse."; exit 1; }
          echo "donnees : $(wc -l < "$F") lignes"

          # ON VERIFIE CE QU'IL CONTIENT, plutot que de faire confiance au
          # comportement par defaut de la CLI. Si une mise a jour restreignait
          # un jour la portee du dump, la sauvegarde continuerait a passer au
          # vert en ayant cesse de couvrir les comptes — exactement le genre de
          # panne qu'on ne decouvre que le jour d'une restauration.
          for attendu in '"auth"."users"' '"public"."boutiques"' '"public"."commandes"'; do
            grep -qF "INSERT INTO $attendu" "$F" || {
              echo "::error::Le dump ne contient pas $attendu. La portee a change."
              exit 1
            }
          done
          echo "portee verifiee : auth.users, public.boutiques, public.commandes"

      # LE REGISTRE N'EST PAS LE FICHIER. Le dump exporte `storage.objects`,
      # c'est-a-dire treize LIGNES decrivant treize images — pas les images. Une
      # base restauree depuis le seul dump afficherait une vignette cassee par
      # produit, et le marchand devrait tout reteleverser. Sur une place de
      # marche, la photo EST la boutique.
      - name: Sauvegarder les images
        env:
          SUPABASE_PROJECT_ID: ${{ env.PROJET }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node scripts/sauvegarder-images.mjs "$RUNNER_TEMP/donnees/images"

      # On ne « cat » jamais ces fichiers : les journaux d'un depot public sont
      # lisibles par tout le monde. On ne montre que des nombres de lignes.
      - name: Pousser vers le depot prive
        env:
          CLE: ${{ secrets.SAUVEGARDE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 git@github.com:oulay2002/djiguiflow-sauvegardes.git "$RUNNER_TEMP/prive"
          cd "$RUNNER_TEMP/prive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `rm -rf` avant la copie : sans lui, un fichier supprime en
          # production resterait dans la sauvegarde pour toujours, et le
          # decompte finirait par mentir.
          rm -rf donnees images
          mkdir -p donnees
          cp "$RUNNER_TEMP/donnees/donnees.sql" donnees/
          cp -r "$RUNNER_TEMP/donnees/images" images

          if [ -z "$(git status --porcelain)" ]; then
            echo "Rien n'a bouge depuis la derniere sauvegarde."
            exit 0
          fi

          git add -A
          git commit -m "sauvegarde au $(date -u '+%Y-%m-%d')" \
                     -m "Donnees, comptes et images. L'historique de ce depot EST la profondeur de retention."
          git push
          echo "Pousse."

      # UNE SAUVEGARDE QUI ECHOUE EN SILENCE N'EST PAS UNE SAUVEGARDE. C'est
      # meme le pire des cas : on croit etre couvert. L'alerte part sur le bot
      # de veille de la plateforme, sans parse_mode — un texte d'erreur avec un
      # `_` ou une `*` ferait echouer l'envoi et rendrait la panne muette.
      - name: Alerter si la sauvegarde a echoue
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_ALERTE_TOKEN }}
          CHAT: ${{ vars.TELEGRAM_ALERTE_CHAT_ID || env.CHAT_DEFAUT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TELEGRAM_ALERTE_TOKEN est absent : la panne de sauvegarde n'a PAS pu etre signalee."
            exit 1
          fi
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=SAUVEGARDE DES DONNEES EN ECHEC. C'est la seule copie des commandes, produits, comptes et images : tant que ceci n'est pas repare, une perte de donnees est definitive. Voir ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null

      # Le succes se dit aussi, mais une seule fois par semaine : une alerte
      # quotidienne qui dit « tout va bien » ne se lit plus au bout de dix
      # jours, et c'est ainsi qu'on rate celle qui compte.
      #
      # ELLE NE PARLE QUE DE CETTE NUIT-LA. Une premiere redaction annoncait
      # « les sept dernieres nuits sont passees » : une execution ne sait rien
      # des six precedentes. C'est le defaut deja rencontre avec la sonde
      # reseau, qui affirmait l'inverifiable — et une alerte qui exagere se fait
      # ignorer exactement comme une alerte qui ment.
      - name: Confirmer le lundi
        if: success() && github.event_name == 'schedule'
        env:
          TOKEN: ${{ secrets.TELEGRAM_ALERTE_TOKEN }}
          CHAT: ${{ vars.TELEGRAM_ALERTE_CHAT_ID || env.CHAT_DEFAUT }}
        run: |
          [ "$(date -u '+%u')" = "1" ] || exit 0
          [ -n "$TOKEN" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=Sauvegarde des donnees : la nuit de ce lundi est passee. L'historique complet se lit dans le depot prive." \
            > /dev/null
