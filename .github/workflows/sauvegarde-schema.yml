# La migration de reference, celle qui rend la base RECONSTRUCTIBLE.
#
# POURQUOI ELLE EXISTE. `supabase/migrations/` est l'HISTOIRE du schema : 58
# fichiers fideles au texte exact applique, commentaires d'intention compris.
# Fidele ne veut pas dire rejouable. Verifie le 22 aout 2026 :
# `20260805224907_harden_security_definer_functions.sql` declare
# `public.http_response`, un type apporte par l'extension `http` — qu'AUCUNE
# migration ne cree, et que `20260817125218` supprime. Rejouer l'historique sur
# une base neuve echoue donc a la troisieme migration.
#
# `AUDIT_SECURITE.md` le disait deja, en R6 : « une restauration reconstruirait
# une base sans ses verrous. C'est le scenario qui transforme un incident en
# fuite. » Et il prescrivait le remede : « une migration de reference, pas une
# retouche de l'historique ».
#
# CE FICHIER EST CE REMEDE. Le dump est APLATI — il perd le decoupage et les
# commentaires — et c'est exactement ce qu'on veut ici : l'historique porte le
# raisonnement, la reference porte l'etat. On ne restaure pas depuis un recit.
#
# ELLE TOURNE PARCE QU'UNE REFERENCE ECRITE A LA MAIN POURRIT. Elle mentirait
# des la migration suivante, et une reference qui ment sur la production est
# pire que pas de reference : on la decouvre fausse le jour ou l'on restaure.
name: Sauvegarde du schema

on:
  schedule:
    # Abidjan ne change jamais d'heure : UTC = heure locale. 5 h 30, juste
    # apres l'export n8n, pour que les deux PR arrivent ensemble.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sauvegarde-schema
  cancel-in-progress: false

jobs:
  sauvegarder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # UNE VERSION FIXE, PAS « latest ».
          #
          # `latest` fait resoudre la derniere release par l'API GitHub, sans
          # jeton. Le 24 aout 2026, cet appel a ete refuse — « rate limit
          # exceeded » — et le garde de schema a echoue sur une PR dont le code
          # etait parfaitement sain.
          #
          # C'EST LE PIRE DEFAUT POSSIBLE POUR UN GARDE. Un controle qui tombe
          # au hasard, pour une raison etrangere a ce qu'il verifie, apprend a
          # relancer sans lire. Le jour ou il tombe pour une VRAIE raison, on
          # relance aussi. Un garde qu'on ignore ne garde rien, et il coute la
          # confiance qu'on avait dans les autres.
          #
          # Une version epinglee supprime l'appel de resolution. Elle se monte
          # a la main, ce qui est le but : la CLI qui compare le depot a la
          # base ne doit pas changer sous nos pieds un matin.
          version: 2.115.0

      # Le secret manquant doit se dire en clair, comme pour le garde de schema.
      - name: Verifier que le jeton est pose
        env:
          JETON: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$JETON" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN est absent : la reference ne peut pas etre produite."
            echo "  gh secret set SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      # `db dump` a besoin de Docker pour executer pg_dump : l'executeur GitHub
      # en a un, la machine de developpement pas forcement. C'est la raison pour
      # laquelle cette sauvegarde vit ici et non dans un script local.
      - name: Ecrire la reference
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p supabase/reference
          supabase db dump --linked --project-ref xshksvlnrgxijsznmkkj \
            -f supabase/reference/schema.sql
          # Un dump vide serait pire qu'une absence de dump : on croirait avoir
          # une reference. On refuse plutot que d'ecrire un fichier creux.
          if [ ! -s supabase/reference/schema.sql ]; then
            echo "::error::Le dump est vide. La reference n'est pas ecrite."
            exit 1
          fi
          echo "reference : $(wc -l < supabase/reference/schema.sql) lignes"

          # LA REFERENCE DOIT DIRE DE QUOI ELLE EST L'INSTANTANE.
          #
          # Eprouve le 22 aout 2026 par une vraie restauration : la reference
          # avait ete ecrite a 16 h 29, la migration des paliers appliquee a
          # 16 h 33. La base restauree portait donc encore l'ancienne
          # `vitrine_boutiques()` — celle qui publie le COMPTE EXACT des
          # livraisons. Restaurer aurait ROUVERT la fuite qu'on venait de
          # fermer, et l'application, qui lit `palier_livraisons`, aurait
          # affiche « Nouvelle boutique » pour tout le monde.
          #
          # Une reference retarde d'au plus vingt-quatre heures. Ce n'est pas un
          # defaut : c'est la nature d'un instantane. Le defaut etait que RIEN
          # ne le disait, donc que personne n'aurait pense a rattraper. Ce
          # filigrane donne la borne exacte : rejouer les fichiers de
          # `supabase/migrations/` dont l'horodatage lui est superieur.
          DERNIERE=$(supabase migration list --linked --project-ref xshksvlnrgxijsznmkkj \
            --output-format json 2>/dev/null \
            | python3 -c "import sys,json;m=[x['remote'] for x in json.load(sys.stdin)['migrations'] if x.get('remote')];print(m[-1] if m else '')")

          if [ -z "$DERNIERE" ]; then
            echo "::error::Impossible de lire la derniere migration appliquee. Une reference sans filigrane ne dit pas ce qu'il faut rattraper."
            exit 1
          fi

          { echo "-- INSTANTANE DU $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo "-- DERNIERE MIGRATION APPLIQUEE : $DERNIERE"
            echo "--"
            echo "-- Pour restaurer : rejouer ce fichier, PUIS tous les fichiers de"
            echo "-- supabase/migrations/ dont l'horodatage est superieur a $DERNIERE."
            echo "-- Sauter cette etape ramene le schema jusqu'a vingt-quatre heures en"
            echo "-- arriere, verrous compris."
            echo ""
            cat supabase/reference/schema.sql
          } > supabase/reference/schema.sql.tmp
          mv supabase/reference/schema.sql.tmp supabase/reference/schema.sql
          echo "filigrane : $DERNIERE"

      - name: Y a-t-il un vrai changement ?
        id: diff
        run: |
          if [ -z "$(git status --porcelain supabase/reference/)" ]; then
            echo "change=non" >> "$GITHUB_OUTPUT"
            echo "Le schema n'a pas bouge depuis la derniere reference."
          else
            echo "change=oui" >> "$GITHUB_OUTPUT"
            git status --short supabase/reference/
          fi

      # UNE PR, PAS UNE POUSSEE DIRECTE, pour la meme raison que l'export n8n :
      # le diff EST la revue. Un changement de schema qui atterrit sans que
      # personne ne le regarde ne vaut pas mieux que pas de trace.
      - name: Ouvrir ou mettre a jour la PR
        if: steps.diff.outputs.change == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCHE="reference-schema"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCHE"
          git add supabase/reference/
          git commit -m "schema : reference au $(date -u '+%Y-%m-%d')" \
                     -m "Sauvegarde automatique. Le diff est la revue : il ne contient que ce qui a change dans le schema de production."
          # `--force-with-lease` SANS REFERENCE DISTANTE REFUSE DE POUSSER.
          #
          # Il compare a la ref de suivi `origin/$BRANCHE` — que ce clone n'a
          # pas, puisqu'il ne connait que `main`. Git repond alors « stale
          # info » et abandonne, sans jamais toucher au distant.
          #
          # CE QUE CA PRODUISAIT, LU DANS L'HISTORIQUE LE 22 AOUT 2026 : cet
          # export n'a REUSSI que les fois ou il n'avait RIEN a pousser. Les
          # quatre executions porteuses d'un changement ont echoue, et un run
          # « rien n'a bouge » se rapporte en succes — donc personne ne l'a vu.
          # Le depot portait une copie perimee, et le garde qui devait
          # l'empecher etait justement celui qui ne tournait pas.
          #
          # On rapatrie donc la branche AVANT de pousser, avec un refspec
          # EXPLICITE. `actions/checkout` configure un refspec limite a la
          # branche extraite : un simple `git fetch origin "$BRANCHE"` remplit
          # FETCH_HEAD sans creer `refs/remotes/origin/$BRANCHE`, et le bail
          # n'aurait toujours rien a quoi se comparer. Corriger a moitie aurait
          # laisse croire que c'etait repare.
          #
          # `|| true` : la premiere fois la branche n'existe pas, et c'est
          # normal — le bail accepte alors une creation.
          git fetch origin "+refs/heads/$BRANCHE:refs/remotes/origin/$BRANCHE" || true
          git push --force-with-lease origin "$BRANCHE"

          if gh pr view "$BRANCHE" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR deja ouverte, mise a jour."
          else
            cat > /tmp/corps-pr.md <<'CORPS'
          La sauvegarde quotidienne a trouve une difference entre la reference du
          depot et le schema de production.

          Le diff ci-dessous est **la revue**. Il ne devrait contenir que ce qu'une
          migration relue a deja introduit : si quelque chose y apparait sans
          migration correspondante, c'est que le schema a ete modifie a la main en
          production — et c'est cela qu'il faut corriger, pas cette PR.

          Cette reference est ce depuis quoi on RESTAURE. `supabase/migrations/`
          reste l'histoire ; elle n'est pas rejouable depuis zero, voir l'en-tete
          de ce workflow.
          CORPS
            sed -i 's/^          //' /tmp/corps-pr.md
            gh pr create --base main --head "$BRANCHE" \
              --title "Schema : la reference a change" \
              --body-file /tmp/corps-pr.md
          fi

      # ── ELLE DECLARE QU'ELLE EST PASSEE ────────────────────────────────────
      #
      # Meme raison que sur la sauvegarde des donnees : une tache qui ECHOUE
      # crie toute seule, une tache qui NE DEMARRE PAS est muette. Le 27 aout
      # 2026, aucune des deux n'a tourne de la nuit et rien ne l'a dit.
      #
      # ELLE POINTE MEME QUAND LE SCHEMA N'A PAS BOUGE. C'est le cas NORMAL, et
      # c'est bien un passage reussi : ce qu'on surveille est que la tache
      # tourne, pas qu'elle trouve quelque chose. Ne pointer qu'en cas de
      # changement ferait crier la sonde chaque fois que le schema est stable —
      # c'est-a-dire presque toujours.
      #
      # Non bloquant : la mission de ce workflow est de tenir la reference, pas
      # de se surveiller.
      - name: Pointer le passage
        if: success()
        continue-on-error: true
        env:
          SECRET: ${{ secrets.SYNC_SECRET }}
          SITE: https://www.djiguiflow.com
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::SYNC_SECRET absent — le passage n'est pas pointe."
            exit 0
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST "$SITE/api/internal/pointage" \
            -H "x-sync-secret: $SECRET" \
            -H 'Content-Type: application/json' \
            -d '{"cle":"sauvegarde_schema","detail":"reference du schema"}')

          if [ "$code" = "200" ]; then
            echo "Passage pointe."
          else
            echo "::warning::Pointage refuse (HTTP $code) — la reference, elle, est a jour."
          fi
