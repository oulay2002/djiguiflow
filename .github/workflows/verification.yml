# Le filet qui manquait.
#
# Jusqu'ici, rien ne verifiait quoi que ce soit automatiquement : deux
# workflows existaient, tous deux dedies a n8n. Le seul garde-fou etait un
# hook `pre-push` local qui lance `tsc --noEmit` — contournable par
# `--no-verify`, absent chez tout nouveau contributeur, et qui ne lance ni les
# tests ni le build.
#
# Consequence concrete : les tests unitaires du depot ne tournaient que si
# quelqu'un y pensait. Un filet qu'on doit se rappeler de tendre n'est pas un
# filet.
#
# CE WORKFLOW NE TOUCHE A RIEN. Il lit, il compile, il teste. Aucun secret
# n'est requis : les tests unitaires simulent les canaux, et le build de Next
# n'a pas besoin des variables d'environnement de production pour verifier que
# le code compile.
name: Verification

on:
  push:
    branches: [main]
  pull_request:

# Une PR poussee trois fois de suite ne doit pas faire tourner trois fois la
# meme verification : seule la derniere compte.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # La version que la machine de developpement utilise. Verrouillee :
          # une montee de version silencieuse de l'executeur ferait diverger la
          # CI du poste, et c'est le genre d'ecart qu'on met une journee a
          # comprendre.
          node-version: '24'
          cache: npm

      # `npm ci` et non `npm install` : il installe exactement ce que le
      # verrou decrit, et echoue si package.json et package-lock.json ont
      # diverge. C'est une verification en soi.
      - name: Installer les dependances
        run: npm ci

      - name: Types
        run: npm run typecheck

      # BLOQUANTE DEPUIS LE 27 AOUT 2026.
      #
      # Elle portait `continue-on-error: true` avec la note « temporaire, a
      # retirer des que les sept erreurs preexistantes sont corrigees ». Le
      # resultat : le linter ne gardait RIEN. Une faute reelle — un `any` pose
      # sur un calcul de prix — y dormait depuis des semaines.
      #
      # Deux des sept etaient de vrais defauts et sont corriges : ce `any`, et
      # un bandeau de pause qui ne se levait pas tout seul parce qu'il lisait
      # l'heure pendant le rendu. Les cinq autres relevent d'une seule regle,
      # degradee en avertissement et documentee dans `eslint.config.mjs` — elle
      # demande de charger les donnees ailleurs, ce qui est une refonte et non
      # une correction de style.
      #
      # Un garde qui arrete quelque chose vaut mieux qu'un garde debranche pour
      # qu'il se taise.
      - name: Style
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      # LE GARDE DU LANGAGE VISUEL, et il n'est pas en continue-on-error.
      #
      # Le 22 aout 2026, la seance visuelle a ramene 228 rayons a 8 et supprime
      # 17 ombres ecrites a la main. Neuf d'entre elles etaient des ombres
      # Tailwind PAR DEFAUT, et ce balayage — qui existait deja — ne les avait
      # jamais vues : il ne cherchait que des couleurs. Le nivellement s'etait
      # donc reinstalle sous un controle qui tournait.
      #
      # Il attrape aussi une classe MORTE : une couleur d'ombre sans ombre
      # n'emet que `--tw-shadow-color`, que rien ne lit. Deux existaient. Elles
      # se relisaient comme une intention, ce qui est pire qu'une absence.
      - name: Langage visuel
        run: npm run verifier:palette

      # DEUX ETATS QUI SE RESSEMBLENT SONT UN ETAT DE MOINS.
      #
      # La traduction de palette a fait passer dix familles a six : deux etats
      # jusque-la distincts pouvaient atterrir sur la meme couleur. C'est
      # arrive a « en preparation » et « en livraison » — le marchand lisait
      # deux fois la meme chose sans savoir laquelle.
      #
      # CE CONTROLE N'ETAIT PAS BRANCHE ICI, et c'est pour cela qu'il avait
      # accumule vingt signalements dont AUCUN n'etait reel. Personne ne le
      # lancait, donc personne ne voyait qu'il criait au loup. Il a ete
      # resserre le 26 aout 2026 : il n'accuse plus que deux entrees d'une
      # meme table portant EXACTEMENT les memes couleurs.
      - name: Etats discernables
        run: npm run verifier:etats

      # LE VERROU DES FONCTIONS SECURITY DEFINER.
      #
      # Le 24 aout 2026, sur les 24 fonctions SECURITY DEFINER de la
      # production, UNE SEULE etait executable par PUBLIC — et personne ne
      # l'avait decide. La migration de la veille avait fait `drop function`
      # puis `create function` : le drop remet les droits a la valeur PAR
      # DEFAUT de Postgres, qui est EXECUTE a PUBLIC, et le `grant` pose
      # ensuite n'en retire rien.
      #
      # Ce cas-la n'ouvrait rien — c'etait l'annuaire public, deja ouvert a
      # anon. La meme migration ecrite pour `prolonger_acces` ou
      # `secret_webhook_n8n` aurait ouvert a tout visiteur de la vitrine une
      # fonction qui contourne RLS par construction. SECURITY DEFINER ne
      # restreint RIEN : le seul verrou est l'ACL.
      #
      # IL VIT ICI, ET PAS DANS LE JOB `schema`, DELIBEREMENT. Il lit un
      # fichier du depot et n'a besoin d'AUCUN secret. Le placer dans un job
      # qui exige SUPABASE_ACCESS_TOKEN lui donnerait une facon de tomber
      # etrangere a ce qu'il verifie — le defaut que la version epinglee du
      # CLI vient justement de fermer, deux commits plus haut.
      - name: Fonctions SECURITY DEFINER
        run: npm run verifier:definer

      - name: Build
        run: npm run build

  # LE GARDE ANTI-DERIVE.
  #
  # Le dossier supabase/migrations a ete reconstitue a la main le 17 aout 2026 —
  # « 38 fichiers, 38 migrations, aucun ecart, verifie ». Le 22 aout, le depot
  # en avait 40 et la base 56 : SEIZE migrations appliquees sans aucun fichier,
  # dont des politiques RLS et des REVOKE sur des fonctions SECURITY DEFINER.
  # La derive est revenue en CINQ JOURS.
  #
  # Une recette reconstruite depuis un depot en retard est PLUS OUVERTE que la
  # production, et des tests y passent qui devaient echouer. Un controle manuel
  # a echoue deux fois ; celui-ci tourne a chaque push.
  #
  # IL N'EST PAS EN continue-on-error, DELIBEREMENT. Un garde qu'on peut ignorer
  # ne garde rien — c'est exactement ce qui a laisse la derive revenir.
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: supabase/setup-cli@v1
        with:
          # UNE VERSION FIXE, PAS « latest ».
          #
          # `latest` fait resoudre la derniere release par l'API GitHub, sans
          # jeton. Le 24 aout 2026, cet appel a ete refuse — « rate limit
          # exceeded » — et le garde de schema a echoue sur une PR dont le code
          # etait parfaitement sain.
          #
          # C'EST LE PIRE DEFAUT POSSIBLE POUR UN GARDE. Un controle qui tombe
          # au hasard, pour une raison etrangere a ce qu'il verifie, apprend a
          # relancer sans lire. Le jour ou il tombe pour une VRAIE raison, on
          # relance aussi. Un garde qu'on ignore ne garde rien, et il coute la
          # confiance qu'on avait dans les autres.
          #
          # Une version epinglee supprime l'appel de resolution. Elle se monte
          # a la main, ce qui est le but : la CLI qui compare le depot a la
          # base ne doit pas changer sous nos pieds un matin.
          version: 2.115.0

      # Le secret manquant doit se dire en clair. Sans ce garde-la, le job
      # echouerait sur une erreur d'authentification obscure et l'on chercherait
      # la panne du mauvais cote.
      - name: Verifier que le jeton est pose
        env:
          JETON: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$JETON" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN est absent : ce garde ne garde rien."
            echo "Creez un jeton dans Supabase (Account -> Access Tokens), puis :"
            echo "  gh secret set SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Le depot et la base disent-ils la meme chose ?
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run verifier:migrations

  # L'audit de dependances vit dans son propre job : une CVE publiee un matin
  # ne doit pas bloquer une correction urgente l'apres-midi. Elle doit se voir,
  # pas barrer la route.
  dependances:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Vulnerabilites connues (production)
        run: npm audit --omit=dev --audit-level=high
